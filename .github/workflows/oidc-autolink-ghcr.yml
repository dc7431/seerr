---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Build OIDC auto-link image (GHCR)

# Fork-only helper. Builds the branch this workflow runs on and publishes a
# single-arch (linux/amd64) image to THIS repository's GitHub Container Registry
# using the built-in GITHUB_TOKEN — no Docker Hub secrets required. Intended for
# pulling onto a home server (e.g. Unraid) to test the OIDC -> Jellyfin
# auto-link feature. This workflow is fork-specific and is intentionally kept
# out of the upstream feature branch / PR.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to publish under ghcr.io/<owner>/<repo>'
        required: false
        default: 'oidc-autolink'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build & push (linux/amd64) to GHCR
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Commit timestamp
        id: ts
        run: echo "TIMESTAMP=$(git log -1 --pretty=%ct)" >> "$GITHUB_OUTPUT"

      - name: Lowercase image name
        id: img
        run: |
          echo "image=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            COMMIT_TAG=${{ github.sha }}
            SOURCE_DATE_EPOCH=${{ steps.ts.outputs.TIMESTAMP }}
          tags: |
            ${{ steps.img.outputs.image }}:${{ inputs.tag }}
          provenance: false
